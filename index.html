<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Le Codex — Starbucks, Cocktails & Recettes de Mamie</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Codex">
<meta name="application-name" content="Codex">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="apple-touch-icon" sizes="167x167" href="apple-touch-icon-167.png">
<link rel="apple-touch-icon" sizes="152x152" href="apple-touch-icon-152.png">
<link rel="apple-touch-icon" sizes="120x120" href="apple-touch-icon-120.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#700122">
<meta name="description" content="Le Codex : 103 boissons Starbucks, 21 cocktails et 22 recettes de famille. Trois questions et tu tombes sur la bonne recette.">
<meta property="og:title" content="Le Codex - Starbucks, Cocktails et Recettes de Mamie">
<meta property="og:image" content="assets/_hero.webp"><meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
--ink:#101A16;--muted:#6B7B74;--white:#fff;
--acc:#00643C;--acc2:#008E65;--accd:#0B4A31;--bg:#E5F3EF;--soft:#D3E9E1;--cream:#F7F5F0;
--r:22px;--sh:0 2px 4px rgba(11,74,49,.04),0 12px 32px rgba(11,74,49,.07);
--shh:0 4px 8px rgba(11,74,49,.06),0 22px 50px rgba(11,74,49,.14);
--tb:calc(62px + env(safe-area-inset-bottom));
}
body[data-tab="ck"]{--acc:#7B2D56;--acc2:#C9457B;--accd:#3B1630;--bg:#F4EAF0;--soft:#EBD9E4;--cream:#FAF4F7}
body[data-tab="mm"]{--acc:#A8542A;--acc2:#C97A3C;--accd:#5C2C13;--bg:#F7EFE6;--soft:#EFE0D0;--cream:#FCF7F1}
html{-webkit-text-size-adjust:100%}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
background:var(--bg);color:var(--ink);line-height:1.55;font-size:15px;overflow-x:hidden;
padding-bottom:var(--tb);transition:background .3s}
img{display:block;max-width:100%}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input{font:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:0 18px}
.hide{display:none!important}

/* HERO */
.hero{position:relative;margin:14px;margin-top:calc(14px + env(safe-area-inset-top));border-radius:30px;overflow:hidden;background:var(--accd);min-height:300px;display:flex;align-items:flex-end}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.95}
.hero::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,20,15,.7) 0%,rgba(8,20,15,.1) 40%,rgba(8,20,15,.85) 100%)}
.hero-in{position:relative;z-index:2;padding:24px 22px 22px;color:#fff;width:100%}
.eyebrow{display:inline-flex;align-items:center;gap:7px;font-size:11px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;
background:rgba(255,255,255,.16);backdrop-filter:blur(10px);padding:7px 13px;border-radius:999px;margin-bottom:12px;border:1px solid rgba(255,255,255,.2)}
.hero h1{font-size:clamp(28px,6.6vw,50px);line-height:.98;font-weight:900;letter-spacing:-.035em;margin-bottom:9px;text-wrap:balance}
.hero h1 em{font-style:normal;opacity:.75}
.hero p{font-size:14px;opacity:.9;max-width:520px}

/* BARRE */
.bar{position:sticky;top:0;z-index:60;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(18px);
border-bottom:1px solid rgba(0,0,0,.06);padding:12px 0}
.searchrow{display:flex;gap:8px;align-items:center}
.search{flex:1;display:flex;align-items:center;gap:10px;background:var(--white);border-radius:999px;padding:11px 16px;box-shadow:var(--sh);min-width:0}
.search input{flex:1;border:none;outline:none;background:none;font-size:15px;min-width:0}
.search svg{flex:none;opacity:.4}
.iconbtn{flex:none;width:44px;height:44px;border-radius:50%;background:var(--white);box-shadow:var(--sh);display:grid;place-items:center;font-size:18px;position:relative}
.iconbtn.on{background:var(--acc);color:#fff}
.sizes{display:flex;background:var(--white);border-radius:999px;padding:4px;box-shadow:var(--sh);flex:none}
.sizes button{padding:8px 11px;border-radius:999px;font-size:12px;font-weight:700;color:var(--muted);white-space:nowrap;transition:.18s;line-height:1.15}
.sizes button.on{background:var(--acc);color:#fff}

/* ASSISTANT */
.wiz{padding:22px 0 4px}
.crumbs{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:14px;min-height:30px}
.crumb{display:inline-flex;align-items:center;gap:6px;background:var(--white);border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.crumb b{color:var(--acc)}
.crumb.step{background:var(--acc);color:#fff}
.crumb.ghost{background:transparent;box-shadow:none;color:var(--muted);font-weight:600}
.wizhead{margin-bottom:16px}
.wizhead .num{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--acc2);margin-bottom:5px}
.wizhead h2{font-size:clamp(23px,5.4vw,34px);font-weight:900;letter-spacing:-.03em;line-height:1.08}
.wizhead p{color:var(--muted);font-size:13.5px;margin-top:4px}

.trackwrap{position:relative;margin:0 -18px}
.track{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding:44px 18px 22px;
scrollbar-width:none;-webkit-overflow-scrolling:touch}
.track::-webkit-scrollbar{display:none}
.opt{flex:none;width:172px;scroll-snap-align:center;border-radius:26px;padding:0 14px 18px;text-align:center;
position:relative;transition:transform .35s cubic-bezier(.2,.8,.3,1),box-shadow .35s,background .3s;
display:flex;flex-direction:column;align-items:center;box-shadow:0 2px 10px rgba(0,0,0,.05)}
.opt .disc{position:absolute;top:34px;left:50%;transform:translateX(-50%);width:112px;height:112px;border-radius:50%;
opacity:.28;transition:.35s}
.opt .im{width:132px;height:132px;margin-top:-38px;object-fit:contain;position:relative;z-index:2;
filter:drop-shadow(0 12px 18px rgba(0,0,0,.18));transition:.35s}
.opt .nm{font-size:15px;font-weight:800;letter-spacing:-.01em;margin-top:10px;position:relative;z-index:2}
.opt .sb{font-size:11.5px;font-weight:600;opacity:.62;margin-top:2px;position:relative;z-index:2;line-height:1.35}
.opt .cnt{margin-top:11px;font-size:11px;font-weight:800;padding:5px 12px;border-radius:999px;
background:rgba(255,255,255,.66);position:relative;z-index:2}
.opt.mid{transform:scale(1.075);box-shadow:0 14px 40px rgba(0,0,0,.16)}
.opt.mid .im{width:152px;margin-top:-52px;filter:drop-shadow(0 18px 24px rgba(0,0,0,.24))}
.opt.mid .disc{width:126px;height:126px;opacity:.4}
.opt.sel{outline:3px solid var(--acc);outline-offset:3px}
.arrows{display:none}
@media(min-width:900px){
 .arrows{display:flex;position:absolute;top:50%;left:0;right:0;justify-content:space-between;pointer-events:none;padding:0 4px;z-index:5}
 .arrows button{pointer-events:auto;width:40px;height:40px;border-radius:50%;background:var(--white);box-shadow:var(--shh);font-size:17px;display:grid;place-items:center}
}
.wizact{display:flex;gap:8px;flex-wrap:wrap;margin-top:2px}
.wizact button{font-size:13px;font-weight:700;padding:10px 16px;border-radius:999px;background:var(--white);box-shadow:var(--sh)}
.wizact button.p{background:var(--acc);color:#fff}

/* RESULTATS */
.section{padding:20px 0 8px}
.sechead{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:4px}
.sechead h2{font-size:24px;font-weight:800;letter-spacing:-.02em}
.sechead span{font-size:12px;font-weight:700;color:var(--muted);white-space:nowrap}
.secdesc{color:var(--muted);font-size:13.5px;margin-bottom:16px}
.note{background:#FDF6E7;border:1px solid #F0DFB4;border-radius:14px;padding:11px 14px;font-size:12.5px;color:#7A5E1E;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.card{background:var(--white);border-radius:var(--r);overflow:hidden;box-shadow:var(--sh);cursor:pointer;
transition:transform .22s cubic-bezier(.2,.8,.3,1),box-shadow .22s;display:flex;flex-direction:column;text-align:left;position:relative}
.card:hover{transform:translateY(-5px);box-shadow:var(--shh)}
.card .ph{background:var(--soft);aspect-ratio:1;overflow:hidden}
.card.wide .ph{aspect-ratio:4/3}
.card .ph img{width:100%;height:100%;object-fit:cover;transition:transform .4s}
.card:hover .ph img{transform:scale(1.05)}
.card .bd{padding:13px 14px 15px;flex:1;display:flex;flex-direction:column}
.card h3{font-size:14.5px;font-weight:700;line-height:1.25;letter-spacing:-.01em;margin-bottom:6px}
.card .tags{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:9px}
.tg{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:3px 7px;border-radius:6px;background:var(--soft);color:var(--acc)}
.tg.b{background:#F2EEE8;color:#786E61}
.card .meta{margin-top:auto;display:flex;gap:12px;font-size:11px;color:var(--muted);font-weight:600;padding-top:6px;border-top:1px solid rgba(0,0,0,.06)}
.card .meta b{color:var(--ink);font-weight:800}
.fav{position:absolute;top:9px;right:9px;z-index:3;width:32px;height:32px;border-radius:50%;
background:rgba(255,255,255,.9);backdrop-filter:blur(6px);display:grid;place-items:center;font-size:14px;line-height:1;box-shadow:0 2px 8px rgba(0,0,0,.1)}
.badge{position:absolute;top:9px;left:9px;z-index:3;font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;
padding:5px 9px;border-radius:8px;background:var(--acc);color:#fff}
.badge.arc{background:#786E61}.badge.sec{background:#5B3E8E}.badge.sai{background:#C4762A}.badge.bas{background:#2A6E8E}
.badge.ok{background:#1F9254}.badge.miss{background:#B4552F}
.chips{display:flex;gap:7px;overflow-x:auto;padding:0 0 14px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;background:var(--white);border-radius:999px;padding:8px 15px;
font-size:13px;font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.05);white-space:nowrap;transition:.18s}
.chip .n{font-size:11px;opacity:.45;font-weight:700}
.chip.on{background:var(--acc);color:#fff}
.empty{text-align:center;padding:50px 20px;color:var(--muted)}
.empty b{display:block;font-size:19px;color:var(--ink);margin-bottom:6px}

/* MODALE */
.ov{position:fixed;inset:0;z-index:200;background:rgba(11,26,20,.55);backdrop-filter:blur(6px);
display:none;align-items:center;justify-content:center;padding:20px;overflow-y:auto}
.ov.on{display:flex}
.sheet{background:var(--cream);border-radius:28px;max-width:880px;width:100%;max-height:92vh;overflow-y:auto;
box-shadow:0 30px 90px rgba(0,0,0,.35);position:relative;animation:up .3s cubic-bezier(.2,.9,.3,1)}
@keyframes up{from{opacity:0;transform:translateY(26px) scale(.98)}to{opacity:1;transform:none}}
.close{position:sticky;top:12px;float:right;margin:12px 12px 0;z-index:5;width:38px;height:38px;border-radius:50%;
background:rgba(255,255,255,.94);box-shadow:0 3px 12px rgba(0,0,0,.14);display:grid;place-items:center;font-size:19px}
.mimg{background:var(--soft);aspect-ratio:16/11;overflow:hidden;border-radius:28px 28px 0 0;margin-top:-50px;position:relative}
.mimg img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;z-index:2}
.mimg img.bg{object-fit:cover;filter:blur(34px) saturate(1.1);transform:scale(1.25);z-index:1}
.mimg.cover img{object-fit:cover}
.mbody{padding:22px 24px 30px}
.mcat{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.14em;color:var(--acc2);margin-bottom:7px}
.mbody h2{font-size:clamp(25px,5.5vw,36px);font-weight:900;letter-spacing:-.03em;line-height:1.05;margin-bottom:12px}
.mtags{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:14px}
.mdesc{font-size:15px;color:#33443D;margin-bottom:20px;max-width:640px}
.nums{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
.num{background:var(--white);border-radius:14px;padding:11px 15px;min-width:92px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.num b{display:block;font-size:18px;font-weight:800;line-height:1.15}
.num span{font-size:9.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:700}
.blk{background:var(--white);border-radius:20px;padding:19px 20px;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.blk h4{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.12em;color:var(--acc);margin-bottom:14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.blk h4 .sz{margin-left:auto;background:var(--soft);color:var(--acc);padding:3px 9px;border-radius:7px;letter-spacing:.05em;font-size:10px}
.ing{display:flex;justify-content:space-between;gap:14px;padding:10px 0;border-bottom:1px dashed rgba(0,0,0,.08);align-items:flex-start}
.ing:last-child{border:none;padding-bottom:0}
.ing .l{font-weight:600;font-size:14px;display:flex;align-items:flex-start;gap:8px}
.ing .l small{display:block;font-weight:500;font-size:11.5px;color:var(--muted);margin-top:2px;line-height:1.4}
.ing .q{font-weight:800;font-size:14px;white-space:nowrap;color:var(--acc);text-align:right}
.pill{font-size:9px;font-weight:800;padding:2px 6px;border-radius:5px;flex:none;margin-top:2px}
.pill.y{background:#DFF3E6;color:#1F7A46}
.pill.n{background:#FBE6DC;color:#B4552F}
ol.steps{list-style:none;counter-reset:s}
ol.steps li{counter-increment:s;position:relative;padding:0 0 15px 38px;font-size:14px;line-height:1.5}
ol.steps li:last-child{padding-bottom:0}
ol.steps li::before{content:counter(s);position:absolute;left:0;top:-1px;width:26px;height:26px;border-radius:9px;
background:var(--acc);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:800}
ol.steps li::after{content:'';position:absolute;left:12.5px;top:28px;bottom:6px;width:1.5px;background:rgba(0,0,0,.09)}
ol.steps li:last-child::after{display:none}
ul.mat{list-style:none;display:flex;flex-wrap:wrap;gap:6px}
ul.mat li{font-size:12.5px;font-weight:600;background:var(--bg);padding:6px 11px;border-radius:9px}
.tipbox{background:linear-gradient(135deg,var(--accd),var(--acc));color:#fff;border-radius:20px;padding:19px 20px;margin-bottom:14px}
.tipbox h4{color:rgba(255,255,255,.75);margin-bottom:9px}
.tipbox p{font-size:14px;opacity:.95}
.machbox{background:#F2EEE8;border-radius:20px;padding:19px 20px;margin-bottom:14px}
.machbox h4{color:#786E61}
.machbox p{font-size:14px;color:#4A4238}
.warn{background:#FDF6E7;border:1px solid #F0DFB4;border-radius:16px;padding:14px 16px;font-size:13px;color:#7A5E1E;margin-bottom:14px}
.srclink{display:inline-flex;gap:6px;font-size:12.5px;font-weight:700;color:var(--acc);text-decoration:none;border-bottom:1.5px solid currentColor}

/* DRAWER */
.dov{position:fixed;inset:0;z-index:300;background:rgba(11,26,20,.5);backdrop-filter:blur(4px);opacity:0;pointer-events:none;transition:opacity .25s}
.dov.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;z-index:310;width:min(430px,90vw);background:var(--cream);
box-shadow:-14px 0 50px rgba(0,0,0,.25);transform:translateX(101%);transition:transform .3s cubic-bezier(.2,.9,.3,1);
overflow-y:auto;padding:calc(18px + env(safe-area-inset-top)) 20px calc(30px + env(safe-area-inset-bottom))}
.drawer.on{transform:none}
.dhead{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.dhead h3{font-size:21px;font-weight:900;letter-spacing:-.02em;flex:1}
.dhead button{width:34px;height:34px;border-radius:50%;background:var(--white);box-shadow:var(--sh);display:grid;place-items:center;font-size:17px}
.dsub{font-size:13px;color:var(--muted);margin-bottom:16px}
.dcount{background:var(--acc);color:#fff;border-radius:16px;padding:14px 16px;margin-bottom:16px}
.dcount b{font-size:24px;font-weight:900;display:block;line-height:1.1}
.dcount span{font-size:12px;opacity:.85}
.dact{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:18px}
.dact button{font-size:12px;font-weight:700;padding:8px 13px;border-radius:999px;background:var(--white);box-shadow:var(--sh)}
.dfam{margin-bottom:18px}
.dfam h5{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin-bottom:9px}
.dline{display:flex;align-items:center;gap:11px;padding:9px 12px;background:var(--white);border-radius:12px;margin-bottom:5px;cursor:pointer;transition:.15s}
.dline:hover{background:var(--soft)}
.dbox{width:21px;height:21px;border-radius:7px;border:2px solid rgba(0,0,0,.18);flex:none;display:grid;place-items:center;font-size:12px;color:#fff;transition:.15s}
.dline.on .dbox{background:var(--acc);border-color:var(--acc)}
.dline span{font-size:13.5px;font-weight:600;flex:1}
.dline i{font-style:normal;font-size:11px;color:var(--muted);font-weight:700}
.dsec{background:var(--white);border-radius:18px;padding:16px 17px;margin-bottom:14px;box-shadow:var(--sh)}
.dsec h5{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.12em;color:var(--acc);margin-bottom:10px}
.dsec p{font-size:12.5px;color:var(--muted);margin-bottom:12px}
.dbtn{display:block;width:100%;text-align:center;font-size:13.5px;font-weight:700;padding:11px;border-radius:12px;background:var(--acc);color:#fff;margin-bottom:7px}
.dbtn.sec{background:var(--bg);color:var(--ink)}
.dbtn.dan{background:#FBE6DC;color:#B4552F}
textarea.exp{width:100%;height:120px;border-radius:12px;border:1px solid rgba(0,0,0,.12);padding:11px;font-size:11px;
font-family:ui-monospace,Menlo,monospace;resize:vertical;margin-bottom:9px;background:#FBFBFA}

/* TABS */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:100;display:flex;
background:color-mix(in srgb,var(--white) 90%,transparent);backdrop-filter:blur(22px);
border-top:1px solid rgba(0,0,0,.07);padding:7px 6px calc(7px + env(safe-area-inset-bottom))}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 4px;border-radius:14px;transition:.18s}
.tabs .ic{font-size:19px;line-height:1;transition:transform .2s}
.tabs .lb{font-size:10px;font-weight:700;color:var(--muted)}
.tabs button.on .lb{color:var(--acc)}
.tabs button.on .ic{transform:translateY(-2px) scale(1.12)}
.tabs button.on{background:var(--bg)}
.toast{position:fixed;left:50%;bottom:calc(var(--tb) + 16px);transform:translateX(-50%) translateY(20px);z-index:400;
background:var(--ink);color:#fff;font-size:13.5px;font-weight:600;padding:11px 20px;border-radius:999px;
opacity:0;pointer-events:none;transition:.25s;box-shadow:0 8px 30px rgba(0,0,0,.3)}
.toast.on{opacity:1;transform:translateX(-50%)}
footer{padding:30px 18px 26px;text-align:center;color:var(--muted);font-size:12.5px;line-height:1.7}
footer b{color:var(--acc)}
@media(min-width:760px){
 body{font-size:16px}
 .hero{margin:20px;min-height:340px}
 .hero-in{padding:34px 36px 30px}
 .mimg{aspect-ratio:16/7}
 .mbody{padding:30px 38px 42px}
 .grid{grid-template-columns:repeat(auto-fill,minmax(228px,1fr));gap:18px}
 .tabs{padding:8px 20% calc(8px + env(safe-area-inset-bottom))}
 .opt{width:196px}
}
@media(max-width:520px){
 .ov{padding:0;align-items:flex-end}
 .sheet{border-radius:26px 26px 0 0;max-height:94vh}
 .mimg{border-radius:26px 26px 0 0}
}
</style>
</head>
<body data-tab="sb">

<div class="hero" id="hero"></div>

<div class="bar">

};

/* STOCK */
const missing=(d,t)=>(d.sk||[]).filter(k=>!S.stock[t].has(k));
const doable=(d,t)=>missing(d,t).length===0;

/* FILTRAGE */
function passes(d,depth){
 const steps=WIZ[S.tab];
 for(let i=0;i<depth;i++){
  const st=steps[i], v=S.wiz[S.tab][i];
  if(v===null||v===undefined)continue;
  if(st.key==='__stock'){ if(v==='oui'&&!doable(d,S.tab))return false; }
  else if(d[st.key]!==v)return false;
 }
 return true;
}
function results(){
 const all=DATA[S.tab]();
 for(let depth=3;depth>=1;depth--){
  const r=all.filter(d=>passes(d,depth));
  if(r.length>=3||depth===1)return {list:r,depth};
 }
 return {list:all,depth:0};
}
function searchable(d){
 const base=d.nom+' '+d.desc+' '+(d.tag||[]).join(' ')+' '+d.ing.map(i=>i.n).join(' ');
 return S.tab==='ck'?base+' '+d.verre+' '+d.tech:base;
}
function searchHits(){
 const w=S.q.toLowerCase().split(' ').filter(Boolean);
 return DATA[S.tab]().filter(d=>{const s=searchable(d).toLowerCase();return w.every(x=>s.includes(x))});
}

 return `<div class="card wide" data-id="${d.id}">

}

function wizView(){
 const steps=WIZ[S.tab], chosen=S.wiz[S.tab];
 let crumbs='';
 steps.forEach((st,i)=>{
  if(i<S.step){const o=st.opts.find(o=>o.v===chosen[i]);
   crumbs+=`<button class="crumb" data-goto="${i}">${st.q.replace(/\s*\?.*/,'')} · <b>${o?o.n:'Peu importe'}</b></button>`}
  else if(i===S.step)crumbs+=`<span class="crumb step">Étape ${i+1}</span>`;
  else crumbs+=`<span class="crumb ghost">${i+1}</span>`;
 });

 if(S.step<steps.length){
  const st=steps[S.step], pal=CARDCOL[S.tab];
  const cards=st.opts.map((o,i)=>{
   const col=pal[i%pal.length];
   const n=countFor(S.step,o.v);
   return `<button class="opt ${chosen[S.step]===o.v?'sel':''}" data-v="${o.v===null?'':o.v}" data-null="${o.v===null?1:0}"
     style="background:${col[0]};color:${col[1]}">
     <span class="disc" style="background:${col[1]}"></span>
     <img class="im" src="${IMG[o.img]}" alt="">
     <span class="nm">${o.n}</span><span class="sb">${o.s}</span>
     <span class="cnt">${n} ${n>1?'recettes':'recette'}</span></button>`}).join('');
  return `<div class="wiz"><div class="crumbs">${crumbs}</div>
   <div class="wizhead"><div class="num">Étape ${S.step+1} sur ${steps.length}</div><h2>${st.q}</h2><p>${st.sub}</p></div>
   <div class="trackwrap"><div class="track" id="track">${cards}</div>
    <div class="arrows"><button data-ar="-1">‹</button><button data-ar="1">›</button></div></div>
   <div class="wizact">${S.step>0?`<button data-back="1">← Revenir</button>`:''}
    <button data-skip="1">Passer cette étape →</button></div></div>`;
 }

 const r=results();
 const shown=r.list.slice(0,8);
 const relax=r.depth<3?`<div class="note">Aucune combinaison exacte avec les trois critères. On a relâché ${3-r.depth===1?'le dernier critère':'les deux derniers critères'} pour te proposer quand même quelque chose.</div>`:'';
 const more=r.list.length>8?`<p class="secdesc">${r.list.length-8} autre${r.list.length-8>1?'s':''} correspondent aussi, affine ou ouvre la liste complète.</p>`:'';
 return `<div class="wiz"><div class="crumbs">${crumbs}<button class="crumb ghost" data-reset="1">recommencer</button></div>
  <div class="wizhead"><div class="num">Résultat</div><h2>${shown.length} propositions pour toi</h2>
   <p>${S.tab==='ck'?'Le badge indique si ton bar suffit.':'Classées par pertinence.'}</p></div>
  ${relax}${more}
  <div class="grid">${shown.map(card).join('')}</div>
  <div class="wizact" style="margin-top:18px"><button data-back="1">← Changer le dernier choix</button>
   <button class="p" data-reset="1">Recommencer</button></div></div>`;
}
function countFor(idx,val){
 const save=S.wiz[S.tab][idx];
 S.wiz[S.tab][idx]=val;
 const n=DATA[S.tab]().filter(d=>passes(d,idx+1)).length;
 S.wiz[S.tab][idx]=save;
 return n;
}
function bindWiz(){
 const app=document.getElementById('app');
 app.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{
  S.wiz[S.tab][S.step]=b.dataset.null==='1'?null:b.dataset.v;S.step++;render();
  window.scrollTo({top:document.querySelector('.bar').offsetTop-1,behavior:'smooth'})});
 app.querySelectorAll('[data-back]').forEach(b=>b.onclick=()=>{S.step=Math.max(0,S.step-1);render()});
 app.querySelectorAll('[data-skip]').forEach(b=>b.onclick=()=>{S.wiz[S.tab][S.step]=null;S.step++;render()});
 app.querySelectorAll('[data-goto]').forEach(b=>b.onclick=()=>{S.step=+b.dataset.goto;render()});
 app.querySelectorAll('[data-reset]').forEach(b=>b.onclick=()=>{S.wiz[S.tab]=[null,null,null];S.step=0;render()});
 const tr=document.getElementById('track');
 if(tr){
  const mark=()=>{const c=tr.scrollLeft+tr.clientWidth/2;let best=null,bd=1e9;
   [...tr.children].forEach(el=>{const d=Math.abs(el.offsetLeft+el.offsetWidth/2-c);if(d<bd){bd=d;best=el}});
   [...tr.children].forEach(el=>el.classList.toggle('mid',el===best))};
  tr.addEventListener('scroll',()=>{clearTimeout(tr._t);tr._t=setTimeout(mark,40)},{passive:true});
  mark();
  app.querySelectorAll('[data-ar]').forEach(b=>b.onclick=()=>tr.scrollBy({left:+b.dataset.ar*210,behavior:'smooth'}));
 }
}

  <button class="dbtn dan" onclick="wipe('stock')">Réinitialiser ${STOCKTITLE[t].toLowerCase()}</button>
  <button class="dbtn dan" onclick="wipe('all')">Tout effacer</button></div>`;
 document.querySelectorAll('[data-b]').forEach(el=>el.onclick=()=>{const k=el.dataset.b;
  S.stock[t].has(k)?S.stock[t].delete(k):S.stock[t].add(k);saveStock();renderDrawer();render()});
}
function stockAll(on){const t=S.tab;STOCKDEF[t].forEach(b=>on?S.stock[t].add(b.k):S.stock[t].delete(b.k));
 saveStock();renderDrawer();render()}
function favNames(){const o={sb:[],ck:[],mm:[]};
 [...S.fav].forEach(k=>{const[t,id]=k.split(':');const d=(DATA[t]?DATA[t]():[]).find(x=>x.id===id);if(d)o[t].push(d.nom)});return o}
function shopping(){const need=new Set();
 [...S.fav].forEach(k=>{const[t,id]=k.split(':');const d=(DATA[t]?DATA[t]():[]).find(x=>x.id===id);
  if(d)missing(d,t).forEach(m=>need.add(m))});return [...need].map(k=>STOCKNAME[k])}
function exportObj(){const f=favNames();return{
 mon_placard:[...S.stock.sb].map(k=>STOCKNAME[k]).sort(),
 mon_bar:[...S.stock.ck].map(k=>STOCKNAME[k]).sort(),
 mon_garde_manger:[...S.stock.mm].map(k=>STOCKNAME[k]).sort(),
 cocktails_realisables:COCKTAILS.filter(c=>doable(c,'ck')).map(c=>c.nom),
 favoris:{starbucks:f.sb,cocktails:f.ck,mamie:f.mm},
 liste_de_courses:shopping()}}
const exportText=()=>JSON.stringify(exportObj(),null,1);
function copyExp(){const t=exportText();
 (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast('Copié'))
 .catch(()=>{const b=document.getElementById('expBox');b.select();document.execCommand('copy');toast('Copié')})}
function dlExp(kind){const o=exportObj();let txt,name,type;
 if(kind==='json'){txt=JSON.stringify(o,null,2);name='codex-mes-donnees.json';type='application/json'}
 else{txt='LISTE DE COURSES\n\n'+(o.liste_de_courses.length?o.liste_de_courses.map(x=>'- '+x).join('\n'):'Rien à acheter pour tes favoris.')
  +'\n\nCOCKTAILS RÉALISABLES\n\n'+o.cocktails_realisables.map(x=>'- '+x).join('\n');
  name='liste-de-courses.txt';type='text/plain'}
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:type+';charset=utf-8'}));
 a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000);toast('Téléchargé')}
function wipe(what){
 if(!confirm('Confirmer la suppression ?'))return;
 if(what==='fav'||what==='all'){S.fav.clear();saveFav()}
 if(what==='stock'||what==='all'){S.stock[S.tab]=new Set(allKeys(S.tab));saveStock()}
 renderDrawer();render();toast('Effacé')}
function openDrawer(){renderDrawer();document.getElementById('drawer').classList.add('on');document.getElementById('dov').classList.add('on')}
function closeDrawer(){document.getElementById('drawer').classList.remove('on');document.getElementById('dov').classList.remove('on')}
let tt;function toast(m){const el=document.getElementById('toast');el.textContent=m;el.classList.add('on');
 clearTimeout(tt);tt=setTimeout(()=>el.classList.remove('on'),1700)}

/* NAV */
function renderHero(){const h=HERO[S.tab];
 document.getElementById('hero').innerHTML=`<img src="${h.img}" alt=""><div class="hero-in">
  <div class="eyebrow">${h.eye}</div><h1>${h.t}<br><em>${h.em}</em></h1><p>${h.p}</p></div>`}
function setTab(t){S.tab=t;sv('tab',t);document.body.dataset.tab=t;S.q='';S.step=0;S.all=false;
 document.getElementById('q').value='';
 document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));
 renderHero();render();window.scrollTo({top:0,behavior:'instant'})}
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>setTab(b.dataset.t));
document.getElementById('btnAll').onclick=()=>{S.all=!S.all;S.q='';document.getElementById('q').value='';render()};
document.getElementById('openDrawer').onclick=openDrawer;
document.getElementById('dov').onclick=closeDrawer;
document.getElementById('ov').onclick=e=>{if(e.target.id==='ov')closeOv()};
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeOv();closeDrawer()}});
document.getElementById('q').oninput=e=>{S.q=e.target.value.trim();render()};
document.getElementById('sizes').querySelectorAll('button').forEach(b=>b.onclick=()=>{
 S.size=b.dataset.s;document.querySelectorAll('#sizes button').forEach(x=>x.classList.toggle('on',x===b));
 const o=document.getElementById('ov');
 if(o.classList.contains('on')){const t=document.querySelector('#sheet h2').textContent;
  const d=DRINKS.find(x=>x.nom===t);if(d)openIt(d.id)}});
['sb','ck','mm'].forEach(t=>{const k='stock_'+t;try{if(localStorage.getItem(LS+k)===null)sv(k,allKeys(t))}catch(e){}});
setTab(S.tab);
</script>
</body>
</html>
