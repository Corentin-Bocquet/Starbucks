<body data-accent="cafe">

<header class="topbar" id="topbar"></header>

<!-- ===== Codex : Cafe, Bar, Recettes ===== -->
<section class="view" id="viewCodex">
  <div class="hero" id="codexHero"></div>

  <div class="searchbar" id="codexBar">
    <div class="wrap"><div class="searchrow">
      <label class="search">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.4-3.4"/></svg>
        <input id="codexQ" type="search" placeholder="Chercher…" autocomplete="off" aria-label="Rechercher">
      </label>
      <div class="seg hide" id="codexSizes">
        <button data-s="t">Tall</button><button data-s="g" class="on">Grande</button><button data-s="v">Venti</button>
      </div>
      <button class="iconbtn accent" id="codexCreate" title="Creer avec l'IA" aria-label="Creer avec l'IA">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9L12 3Z"/><path d="M19 15.5l.7 1.8 1.8.7-1.8.7-.7 1.8-.7-1.8-1.8-.7 1.8-.7.7-1.8Z"/></svg>
      </button>
      <button class="iconbtn" id="codexAll" title="Voir tout" aria-label="Voir tout">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></svg>
      </button>
      <button class="iconbtn" id="codexStockBtn" title="Mon stock" aria-label="Mon stock">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8h14l-1 12H6L5 8Z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>
      </button>
    </div></div>
  </div>

  <div class="wrap" id="codexApp"></div>
  <footer id="codexFoot"></footer>
</section>

<section class="view" id="viewFood"></section>
